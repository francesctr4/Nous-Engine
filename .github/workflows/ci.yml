name: CI

on:
  push:
    branches: [main, develop, audio-engine-2.0, skeletal-animation]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same branch/PR.
# Keeps the latest commit building and frees runners from superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force JavaScript actions onto Node 24. checkout@v6 and cache@v5 already run on
# Node 24, but ilammy/msvc-dev-cmd has no Node-24 release (last tag is from 2024),
# so this opt-in is what clears its Node 20 deprecation warning. Harmless for the
# actions already on Node 24. Becomes the runner default on 2026-06-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: Debug-Windows
          - os: ubuntu-latest
            preset: Debug-Linux
          - os: macos-latest
            preset: Debug-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Persist vcpkg's file-based binary cache across runs so later runs skip
      # recompiling unchanged ports (ffmpeg/assimp/shaderc/...). vcpkg's binary-archive
      # names embed an ABI hash that includes the COMPILER version, so a cache key that
      # never changes is a trap: when the runner image rotates its toolchain, every
      # archive ABI-mismatches, vcpkg rebuilds all ports from source (~55 min on
      # Windows), and actions/cache refuses to save on an exact-key hit — so the rebuild
      # repeats every run FOREVER. That is not hypothetical: on 2026-09-11 Windows and
      # macOS both logged an exact key hit followed by `Restored 0 package(s)` and a
      # full from-source rebuild that could never be saved back.
      #
      # The key was ALREADY meant to roll per image — but it embedded
      # `env.ImageOS`/`env.ImageVersion`, which resolve to the EMPTY STRING in the env
      # context (they are runner-process variables, not workflow env), so the key came
      # out as the literal `vcpkg-Linux---<hash>` and never rolled at all. The
      # "Identify runner image" step below reads them where they actually exist — the
      # step's process environment — and republishes them through GITHUB_ENV, which IS
      # visible to the expression context. It echoes what it resolved so an empty value
      # is visible in the log instead of silently collapsing the key again.
      #
      # Key is otherwise deliberately stable (no github.run_id suffix): the steady
      # state is ONE cache entry per OS, reused indefinitely and re-saved only when it
      # was not an exact hit. See the save step.
      #
      # RESTORE AND SAVE ARE SEPARATE STEPS ON PURPOSE: actions/cache declares
      # `post-if: success()`, so its combined form saves NOTHING when any later step
      # fails. A single failing unit test therefore costs a full from-source rebuild on
      # every subsequent run until it is fixed, and nothing repopulates the cache in the
      # meantime. The save step below runs unless the job was cancelled.
      # (`save-always` is the deprecated fix for this; the restore/save split is the
      # supported one.)
      #
      # NOTE: the compiled binaries only land here because the "Use vcpkg files binary
      # cache" step below overrides run-vcpkg's default (removed) x-gha backend.
      - name: Identify runner image
        shell: bash
        run: |
          echo "Runner image: ImageOS='${ImageOS:-}' ImageVersion='${ImageVersion:-}'"
          echo "RUNNER_IMAGE_TAG=${ImageOS:-unknownos}-${ImageVersion:-unknownver}" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary archives
        id: vcpkg_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE_TAG }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE_TAG }}-
            vcpkg-${{ runner.os }}-

      # Clone vcpkg as a sibling of the repo — matches the toolchainFile path in CMakePresets.json
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/../vcpkg
          vcpkgJsonGlob: vcpkg.json

      # lukka/run-vcpkg auto-sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite', but the
      # x-gha backend has been REMOVED from vcpkg (no-op + warning). Override it to the
      # file-based provider pointed at the cached dir above. Must run AFTER Setup vcpkg so
      # this is the last writer to VCPKG_BINARY_SOURCES before Configure.
      - name: Use vcpkg files binary cache
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_binary_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            nasm \
            gperf \
            python3-jinja2 \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxcb-dri2-0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            pkg-config \
            libltdl-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Set up MSVC environment so CMake picks cl.exe instead of MinGW (both are on PATH on windows-latest)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # A converted target's public headers resolve ONLY through its
      # <Target>_headers handle, never through the global Source/ include root,
      # so a consumer that fails to declare the link breaks -- sometimes not in
      # itself but in whatever includes its public header. This catches both
      # cases statically, in seconds, without a build. See CONVENTIONS.md,
      # "Target Layout". Windows-only because the check reads CMakeLists and
      # #include lines: it is platform-independent, so one runner is enough.
      #
      # It also enforces LAYER direction, which the build cannot: a target now
      # compiles only what it declares, but nothing stops it from DECLARING an
      # upward edge (Systems -> Modules, Editor -> VulkanBackend). Those rules
      # were convention + grep until the link graph became honest enough to check.
      - name: Check header layout and layer direction
        if: runner.os == 'Windows'
        run: python Tools/check_header_layout.py

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNOUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build Build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir Build/${{ matrix.preset }} --output-on-failure --parallel

      # Last step, and deliberately NOT conditioned on the build or the tests passing:
      # the ports vcpkg just compiled are worth keeping regardless of whether OUR code
      # compiled or OUR tests went green. That is the whole reason restore and save are
      # split — the combined action would skip this. Skipped only on cancellation,
      # where the runner tears the job down anyway.
      #
      # `cache-hit != 'true'` keeps the steady state at one entry per OS: an exact hit
      # means the cache is already current, so re-uploading it would only duplicate.
      # A partial (restore-keys) hit or a miss DOES save, which is what lets an image
      # rotation or a vcpkg.json bump cost one slow run instead of every run.
      - name: Save vcpkg binary archives
        if: ${{ !cancelled() && steps.vcpkg_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ runner.os }}-${{ env.RUNNER_IMAGE_TAG }}-${{ hashFiles('vcpkg.json') }}
