name: CI

on:
  push:
    branches: [main, develop, audio-engine, renderer-narrow-port]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same branch/PR.
# Keeps the latest commit building and frees runners from superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force JavaScript actions onto Node 24. checkout@v6 and cache@v5 already run on
# Node 24, but ilammy/msvc-dev-cmd has no Node-24 release (last tag is from 2024),
# so this opt-in is what clears its Node 20 deprecation warning. Harmless for the
# actions already on Node 24. Becomes the runner default on 2026-06-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: Debug-Windows
          - os: ubuntu-latest
            preset: Debug-Linux
          - os: macos-latest
            preset: Debug-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Persist vcpkg's file-based binary cache across runs so later runs skip
      # recompiling unchanged ports (ffmpeg/assimp/shaderc/...). vcpkg's binary-archive
      # names embed an ABI hash that includes the COMPILER version, so the cache key MUST
      # roll when the runner image's toolchain changes — otherwise an image rotation (e.g.
      # windows-latest -> windows-2025-vs2026) leaves the key constant while every archive
      # ABI-mismatches: the stale cache keeps restoring (exact hit), vcpkg rebuilds all
      # ports from source, and actions/cache refuses to re-save on an exact-key hit, so the
      # rebuild repeats every run forever (~55 min on Windows). Including ImageOS/ImageVersion
      # makes the key roll per image; on a bump the exact key misses, restore-keys partial-
      # restores the previous cache (archives still reused if the ABI is unchanged, rebuilt
      # only if it genuinely changed), and a fresh entry is SAVED under the new key. Same
      # mechanism absorbs a vcpkg.json change.
      # NOTE: the compiled binaries only land here because the "Use vcpkg files binary
      # cache" step below overrides run-vcpkg's default (removed) x-gha backend.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-
            vcpkg-${{ runner.os }}-${{ env.ImageOS }}-
            vcpkg-${{ runner.os }}-

      # Clone vcpkg as a sibling of the repo — matches the toolchainFile path in CMakePresets.json
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/../vcpkg
          vcpkgJsonGlob: vcpkg.json

      # lukka/run-vcpkg auto-sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite', but the
      # x-gha backend has been REMOVED from vcpkg (no-op + warning). Override it to the
      # file-based provider pointed at the cached dir above. Must run AFTER Setup vcpkg so
      # this is the last writer to VCPKG_BINARY_SOURCES before Configure.
      - name: Use vcpkg files binary cache
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_binary_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            nasm \
            gperf \
            python3-jinja2 \
            libvulkan-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxcb-dri2-0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            pkg-config \
            libltdl-dev \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Set up MSVC environment so CMake picks cl.exe instead of MinGW (both are on PATH on windows-latest)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      # A converted target's public headers resolve ONLY through its
      # <Target>_headers handle, never through the global Source/ include root,
      # so a consumer that fails to declare the link breaks -- sometimes not in
      # itself but in whatever includes its public header. This catches both
      # cases statically, in seconds, without a build. See CONVENTIONS.md,
      # "Target Layout". Windows-only because the check reads CMakeLists and
      # #include lines: it is platform-independent, so one runner is enough.
      - name: Check header layout declarations
        if: runner.os == 'Windows'
        run: python Tools/check_header_layout.py

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNOUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build Build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir Build/${{ matrix.preset }} --output-on-failure --parallel
