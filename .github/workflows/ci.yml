name: CI

on:
  push:
    branches: [main, develop, audio-engine, video-player]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit is pushed to the same branch/PR.
# Keeps the latest commit building and frees runners from superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: Debug-Windows
          - os: ubuntu-latest
            preset: Debug-Linux
          - os: macos-latest
            preset: Debug-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Persist vcpkg's file-based binary cache across runs so later runs skip
      # recompiling unchanged ports (ffmpeg/assimp/shaderc/...). Keyed purely on
      # vcpkg.json (which contains the builtin-baseline): an exact key hit reuses the
      # cache WITHOUT re-saving (one entry per OS, stable until deps change). When
      # vcpkg.json changes the exact key misses, the restore-keys prefix restores the
      # previous cache for partial reuse, and a new entry is saved under the new hash.
      # vcpkg's port set is deterministic per vcpkg.json, so there's no incomplete-cache
      # risk that would need a run-id-suffixed key.
      # NOTE: the compiled binaries only land here because the "Use vcpkg files binary
      # cache" step below overrides run-vcpkg's default (removed) x-gha backend.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # Clone vcpkg as a sibling of the repo — matches the toolchainFile path in CMakePresets.json
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/../vcpkg
          vcpkgJsonGlob: vcpkg.json

      # lukka/run-vcpkg auto-sets VCPKG_BINARY_SOURCES to 'clear;x-gha,readwrite', but the
      # x-gha backend has been REMOVED from vcpkg (no-op + warning). Override it to the
      # file-based provider pointed at the cached dir above. Must run AFTER Setup vcpkg so
      # this is the last writer to VCPKG_BINARY_SOURCES before Configure.
      - name: Use vcpkg files binary cache
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_binary_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ninja-build \
            nasm \
            libvulkan-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxrandr-dev \
            libxext-dev \
            libxcb-dri2-0-dev \
            pkg-config \
            libltdl-dev \
            autoconf \
            automake \
            libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Set up MSVC environment so CMake picks cl.exe instead of MinGW (both are on PATH on windows-latest)
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DNOUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build Build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --test-dir Build/${{ matrix.preset }} --output-on-failure --parallel
